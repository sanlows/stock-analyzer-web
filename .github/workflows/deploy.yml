name: Publish stock analyzer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare website
        run: |
          mkdir -p site
          cp index.html style.css app.js open-data.html .nojekyll site/
          cp -r data site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: publish
        uses: actions/deploy-pages@v4
      - name: Verify anonymous access from GitHub runner
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          observed="$(mktemp)"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$base/data/status.json?verify=$GITHUB_SHA" -o "$observed" &&
               cmp -s site/data/status.json "$observed"; then
              break
            fi
            sleep 5
          done
          cmp site/data/status.json "$observed"
          curl --fail --silent --show-error "$base/" -o "$observed"
          grep -F '台股研究室' "$observed"
          curl --fail --silent --show-error "$base/data/market.json" -o "$observed"
          jq -e '(.indices.listed|length > 230) and (.indices.otc|length > 230)' "$observed"
          curl --fail --silent --show-error "$base/data/stock/2330.json" -o "$observed"
          jq -e '(.quarters|length == 8) and (.months|length == 36)' "$observed"
