name: Publish stock analyzer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare website
        run: |
          mkdir -p site
          cp index.html style.css app.js open-data.html .nojekyll site/
          cp -r data site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: publish
        uses: actions/deploy-pages@v4
