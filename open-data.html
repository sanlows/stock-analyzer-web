  <h1>資料集與授權</h1>
  <p>資料提供機關為金融監督管理委員會證券期貨局。來源為臺灣證券交易所與證券櫃檯買賣中心提供的政府開放資料及公開資訊觀測站申報資訊。本站依資料日期整理、換算單位、計算均線及估值欄位。</p>
  <ul>
    <li><a href="https://data.gov.tw/dataset/11755">發行量加權股價指數歷史資料</a></li>
    <li><a href="https://data.gov.tw/dataset/11391">櫃買指數歷史資料</a></li>
    <li><a href="https://data.gov.tw/dataset/11680">集中市場融資融券餘額</a></li>
    <li><a href="https://data.gov.tw/dataset/11743">上櫃股票三大法人買賣金額彙總表</a></li>
    <li><a href="https://data.gov.tw/dataset/18420">上市公司每月營業收入彙總表</a>、<a href="https://data.gov.tw/dataset/56510">上櫃公司每月營業收入彙總表</a></li>
    <li><a href="https://openapi.twse.com.tw/">證交所 OpenAPI</a>、<a href="https://www.tpex.org.tw/openapi/">櫃買中心 OpenAPI</a>、<a href="https://mops.twse.com.tw/">公開資訊觀測站</a></li>
  </ul>
  <p>開放資料按<a href="https://data.gov.tw/license">政府資料開放授權條款第 1 版</a>使用。正式公告及各期原始報表請以資料提供機關為準。</p>
